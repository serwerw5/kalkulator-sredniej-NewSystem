<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Średniej — os8</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #0b0e14;
            background-image: radial-gradient(circle at 50% 0%, #1a233d 0%, transparent 60%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Znaczek NewSystem w prawym górnym rogu */
        .system-badge {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(18, 24, 38, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-top: 40px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
        .subject-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
        }
        input.subject-name { flex: 2; }
        input.subject-grades { flex: 3; }
        .btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid #2563eb;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Badge w rogu -->
    <div class="system-badge">NewSystem</div>

    <div class="container">
        <h1>Kalkulator Średniej Ocen</h1>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px; text-align: center;">
            Wpisz oceny rozdzielone przecinkami lub spacją (np. 5, 4, 3, 5+ -> 5.5).
        </p>

        <div id="subjects-list">
            <div class="subject-row">
                <input type="text" class="subject-name" placeholder="Przedmiot (np. Matematyka)">
                <input type="text" class="subject-grades" placeholder="Oceny (np. 5, 4, 6)">
            </div>
            <div class="subject-row">
                <input type="text" class="subject-name" placeholder="Przedmiot (np. J. polski)">
                <input type="text" class="subject-grades" placeholder="Oceny (np. 4, 5, 3)">
            </div>
        </div>

        <button class="btn" style="background: rgba(255,255,255,0.05); margin-bottom: 10px;" onclick="addSubject()">+ Dodaj kolejny przedmiot</button>
        <button class="btn" onclick="calculateAverage()">Oblicz Średnią Główną</button>

        <div class="result-box" id="result-box" style="display: none;">
            Średnia całkowita: <span id="final-average">0.00</span>
        </div>
    </div>

    <script>
        function addSubject() {
            const container = document.getElementById('subjects-list');
            const row = document.createElement('div');
            row.className = 'subject-row';
            row.innerHTML = `
                <input type="text" class="subject-name" placeholder="Przedmiot">
                <input type="text" class="subject-grades" placeholder="Oceny (np. 5, 4, 3)">
            `;
            container.appendChild(row);
        }

        function calculateAverage() {
            const rows = document.querySelectorAll('.subject-row');
            let subjectAverages = [];

            rows.forEach(row => {
                const gradesInput = row.querySelector('.subject-grades').value;
                if (!gradesInput.trim()) return;

                const grades = gradesInput.replace(/,/g, ' ').split(/\s+/)
                    .map(g => g.trim())
                    .filter(g => g.length > 0)
                    .map(g => {
                        if (g.endsWith('+')) return parseFloat(g) + 0.5;
                        if (g.endsWith('-')) return parseFloat(g) - 0.25;
                        return parseFloat(g);
                    })
                    .filter(n => !isNaN(n));

                if (grades.length > 0) {
                    const avg = grades.reduce((a, b) => a + b, 0) / grades.length;
                    subjectAverages.push(avg);
                }
            });

            if (subjectAverages.length === 0) {
                alert("Wprowadź poprawne oceny w przynajmniej jednym przedmiocie.");
                return;
            }

            const finalAvg = subjectAverages.reduce((a, b) => a + b, 0) / subjectAverages.length;
            document.getElementById('final-average').innerText = finalAvg.toFixed(2);
            document.getElementById('result-box').style.display = 'block';
        }
    </script>
</body>
</html>
